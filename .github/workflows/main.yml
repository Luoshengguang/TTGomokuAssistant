name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q source.zip -d project

      - name: Locate project
        id: locate
        run: |
          SETTINGS_FILE=$(find project -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "找不到 settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix Java and Kotlin JVM target
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"

          if not path.exists():
              raise SystemExit(f"找不到文件: {path}")

          text = path.read_text(encoding="utf-8")

          start = text.find("android {")
          if start == -1:
              raise SystemExit("找不到 android 配置块")

          open_pos = text.find("{", start)
          depth = 0
          close_pos = -1

          for i in range(open_pos, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      close_pos = i
                      break

          if close_pos == -1:
              raise SystemExit("android 配置块结构异常")

          additions = []

          if "compileOptions {" not in text:
              additions.append("""
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """)

          if "kotlinOptions {" not in text:
              additions.append("""
              kotlinOptions {
                  jvmTarget = "17"
              }
              """)

          if additions:
              text = text[:close_pos] + "\n" + "\n".join(additions) + "\n" + text[close_pos:]
              path.write_text(text, encoding="utf-8")

          print("Java 和 Kotlin JVM target 配置检查完成")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Build APK
        run: |
          gradle -p "${{ steps.locate.outputs.dir }}" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTGomokuAssistant-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
