name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q source.zip -d project

      - name: Locate project
        id: locate
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "找不到 settings.gradle.kts"
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          gradle -p "${{ steps.locate.outputs.dir }}" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTGomokuAssistant-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
